<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Menu — Warmindo Sandaga</title>
<meta name="theme-color" content="#0c3a35"/>
<!-- Penghubung Manifest untuk Android/Chrome -->
<link href="manifest.json" rel="manifest"/>
<!-- Ikon Standar & Apple Touch Icon -->
<link href="ikon.png" rel="icon" type="image/png"/>
<link href="ikon.png" rel="apple-touch-icon"/>
<link href="ikon.png" rel="apple-touch-icon" sizes="152x152"/>
<link href="ikon.png" rel="apple-touch-icon" sizes="167x167"/>
<link href="ikon.png" rel="apple-touch-icon" sizes="180x180"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --teal-950:#0c3a35;
  --teal-800:#0f4c46;
  --teal-700:#146258;
  --teal-600:#1a7566;
  --cream-50:#fbf5e4;
  --cream-100:#f3e6bf;
  --rust-600:#c1442d;
  --rust-700:#a3371f;
  --gold-500:#dba43c;
  --gold-600:#c28f2c;
  --gold-100:#faedcd;
  --ink-900:#1b2a26;
  --ink-600:#54655f;
  --white:#fffdf7;
  --line:#e4d5ab;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Poppins',sans-serif;
  background:var(--cream-50);
  color:var(--ink-900);
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:'Bebas Neue',cursive;letter-spacing:0.5px;}

/* ===== TOPBAR: pil melayang di atas, satu gaya dengan dock bawah ===== */
:root{ --pill-h:54px; --pill-gap:10px; }
.topbar{
  position:sticky; top:calc(var(--pill-gap) + var(--safe-top)); z-index:40;
  box-sizing:border-box; height:var(--pill-h);
  margin:calc(var(--pill-gap) + var(--safe-top)) 12px 0;
  display:flex; align-items:center; justify-content:center; gap:11px;
  background:rgba(12,58,53,0.96);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(219,164,60,0.35);
  border-radius:22px;
  padding:0 16px;
  box-shadow:0 14px 30px -10px rgba(12,58,53,0.6);
}
.topbar img{
  width:36px; height:36px; border-radius:50%;
  border:2px solid var(--gold-500);
  object-fit:cover; background:var(--cream-100); flex-shrink:0;
}
.topbar-text{ min-width:0; }
.topbar .eyebrow{
  font-size:9.5px; letter-spacing:2px; color:var(--gold-500); font-weight:600; line-height:1.2;
}
.topbar .brand{ font-size:15px; font-weight:700; color:var(--cream-50); line-height:1.2; white-space:nowrap; }

/* ===== GRADASI GELAP di atas & bawah: menyamarkan menu yang lewat di belakang header & dock =====
   Zona di belakang pil/dock PEKAT 100% (tidak ada yang tembus), baru setelah itu memudar.
   Juga memanjang melewati tepi layar (--fade-over) agar tidak bocor saat tinggi layar berubah. */
:root{
  --fade-over:80px;
  --fade-over-bot:5px;                                           /* gradasi bawah keluar frame +5px */
  --fade-ease:20px;                                              /* panjang bagian yang memudar */
  --fade-solid-top:calc(var(--pill-gap) + var(--safe-top) + var(--pill-h) + 2px);
  --fade-solid-bot:calc(12px + var(--safe-bottom) + 58px + 2px); /* tinggi dock + jarak */
}
body::before, body::after{
  content:''; position:fixed; left:0; right:0; z-index:25;
  pointer-events:none;
}
body::before{
  top:calc(-1 * var(--fade-over));
  height:calc(var(--fade-over) + var(--fade-solid-top) + var(--fade-ease));
  background:linear-gradient(to bottom,
    rgb(251,245,228) 0, rgb(251,245,228) calc(var(--fade-over) + var(--fade-solid-top)),
    rgba(251,245,228,0.6) calc(var(--fade-over) + var(--fade-solid-top) + var(--fade-ease) * 0.4),
    rgba(251,245,228,0.2) calc(var(--fade-over) + var(--fade-solid-top) + var(--fade-ease) * 0.75),
    rgba(251,245,228,0) 100%);
}
body::after{
  bottom:calc(-1 * var(--fade-over-bot));
  height:calc(var(--fade-over-bot) + var(--fade-solid-bot) + var(--fade-ease));
  background:linear-gradient(to top,
    rgb(251,245,228) 0, rgb(251,245,228) calc(var(--fade-over-bot) + var(--fade-solid-bot)),
    rgba(251,245,228,0.6) calc(var(--fade-over-bot) + var(--fade-solid-bot) + var(--fade-ease) * 0.4),
    rgba(251,245,228,0.2) calc(var(--fade-over-bot) + var(--fade-solid-bot) + var(--fade-ease) * 0.75),
    rgba(251,245,228,0) 100%);
}

/* ===== CATEGORY DOCK (melayang di bawah, terpisah dari isi menu) ===== */
body{ padding-bottom:0; }
.catnav-wrap{
  position:fixed; z-index:30;
  left:50%; transform:translateX(-50%);
  bottom:calc(12px + var(--safe-bottom));
  width:calc(100% - 24px);
  background:rgba(12,58,53,0.96);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(219,164,60,0.35);
  border-radius:22px;
  padding:6px;
  box-shadow:0 14px 30px -10px rgba(12,58,53,0.6);
}
.catnav{
  display:flex; gap:4px; overflow-x:auto;
  padding:0; scrollbar-width:none; scroll-behavior:smooth;
}
.catnav::-webkit-scrollbar{display:none;}
.catnav button{
  /* lebar dibagi rata -> simetris; kalau kategori banyak, dock bisa digeser */
  flex:1 0 0; min-width:max-content;
  font-family:inherit; cursor:pointer;
  background:transparent; border:0;
  color:var(--cream-100);
  font-weight:600; font-size:13px;
  padding:0 6px; min-height:44px;
  border-radius:16px;
  white-space:nowrap; text-align:center;
  transition:background .2s, color .2s;
}
.catnav button.active{
  background:var(--gold-500); color:var(--teal-950); font-weight:700;
}

/* ===== MAIN ===== */
main{ max-width:none; margin:0 auto; padding:24px 12px calc(80px + var(--safe-bottom)); }
.cat-section{ margin-bottom:0; }
.cat-section.is-hidden{ display:none; }
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
  gap:16px;
}
.item-card{
  background:var(--white);
  border:1.5px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  position:relative;
  display:flex; flex-direction:column;
  transition:transform .15s ease, box-shadow .15s ease;
  opacity:0;
  animation:itemPop .38s ease forwards;
}
.item-card:hover{ transform:translateY(-3px); box-shadow:0 14px 26px -18px rgba(12,58,53,0.4); }
@keyframes itemPop{
  from{ opacity:0; transform:translateY(10px) scale(.98); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}
.cat-section{
  opacity:0;
  animation:sectionIn .3s ease forwards;
}
@keyframes sectionIn{
  from{ opacity:0; }
  to{ opacity:1; }
}
/* Setelah render pertama, update realtime tidak mengulang animasi masuk */
main.no-anim .cat-section,
main.no-anim .item-card{ animation:none; opacity:1; }
.item-photo{
  aspect-ratio:1/1;
  width:100%;
  position:relative;
  overflow:hidden;
  background:linear-gradient(100deg, var(--cream-100) 28%, var(--gold-100) 50%, var(--cream-100) 72%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
}
.item-photo img{
  width:100%; height:100%; object-fit:cover; display:block;
  opacity:0;
  transition:opacity .35s ease;
}
.item-photo img.loaded{ opacity:1; }
.item-photo.loaded{ animation:none; background:none; }
@keyframes shimmer{
  0%{ background-position:200% 0; }
  100%{ background-position:-200% 0; }
}
.item-photo::after{
  content:'';
  position:absolute;
  left:0; right:0; bottom:0;
  height:38%;
  background:linear-gradient(to bottom, rgba(255,253,247,0) 0%, var(--white) 92%);
  pointer-events:none;
}
.item-photo.placeholder{
  display:flex; align-items:center; justify-content:center;
  background:var(--white);
  animation:none;
}
.item-photo.placeholder::after{ content:none; }
.nophoto-stamp, .loading-stamp{
  --stamp:#b3553f;
  transform:rotate(-5deg);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:12px 16px 11px;
  color:var(--stamp);
  border:2px solid var(--stamp);
  border-radius:14px;
  outline:1px dashed var(--stamp); outline-offset:-7px;
  background:rgba(179,85,63,0.05);
  opacity:0.78;
}
.nophoto-stamp svg, .loading-stamp svg{ width:24px; height:24px; opacity:0.9; }
.nophoto-stamp span, .loading-stamp span{
  font-size:9.5px; font-weight:700; line-height:1.45;
  letter-spacing:1.2px; text-transform:uppercase; text-align:center;
}

/* Stempel saat gambar masih dimuat: di tengah kotak foto, ikon berputar pelan */
.loading-stamp{
  --stamp:var(--teal-700);
  position:absolute; top:50%; left:50%; z-index:1;
  transform:translate(-50%,-50%) rotate(-5deg);
  background:rgba(255,253,247,0.7);
  pointer-events:none;
}
.loading-stamp svg{ animation:spin 1.1s linear infinite; }
.item-photo.loaded .loading-stamp{ display:none; }

/* ===== STEMPEL MENU BARU (dipasang kasir lewat field isNew) ===== */
.new-stamp{
  position:absolute; top:9px; right:9px; z-index:2;
  --stamp:var(--rust-600);
  transform:rotate(9deg);
  display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:4px 9px 3px;
  color:var(--stamp);
  border:2px solid var(--stamp);
  border-radius:9px;
  outline:1px dashed var(--stamp); outline-offset:-4px;
  background:rgba(255,253,247,0.88);
  box-shadow:0 4px 10px -5px rgba(0,0,0,0.35);
  pointer-events:none;
  animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) .25s both;
}
.new-stamp small{
  font-size:7.5px; font-weight:700; letter-spacing:2px; line-height:1;
  text-transform:uppercase; padding-left:2px;
}
.new-stamp b{
  font-family:'Bebas Neue',cursive; font-weight:400;
  font-size:21px; line-height:0.95; letter-spacing:1.5px;
}
@keyframes stampIn{
  from{ opacity:0; transform:rotate(9deg) scale(1.9); }
  to{ opacity:1; transform:rotate(9deg) scale(1); }
}
main.no-anim .new-stamp{ animation:none; }

/* ===== HABIS (sold out) ===== */
.item-card.sold-out .item-photo img{
  filter:grayscale(1) contrast(0.95);
  opacity:0.75;
}
.item-card.sold-out .item-photo.placeholder{
  filter:grayscale(1);
  opacity:0.6;
}
.item-card.sold-out .item-name,
.item-card.sold-out .item-price{ opacity:0.55; }
.soldout-badge{
  position:absolute; top:8px; left:8px; z-index:2;
  background:var(--rust-700); color:var(--cream-50);
  font-size:10.5px; font-weight:700; letter-spacing:0.5px;
  padding:4px 10px; border-radius:100px;
  text-transform:uppercase;
  box-shadow:0 4px 10px -4px rgba(0,0,0,0.4);
}
.item-body{
  padding:11px 12px 13px;
  margin-top:-14px;
  position:relative; z-index:1;
  display:flex; flex-direction:column; gap:2px; flex:1;
}
.item-name{
  font-size:14.5px; font-weight:700; color:var(--ink-900);
  line-height:1.3;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  overflow:hidden;
}
.item-price{
  margin-top:0;
  font-family:'Bebas Neue',cursive; letter-spacing:0.4px;
  font-size:23px; line-height:1; color:var(--rust-700);
}
.item-price::before{ content:'Rp '; font-size:12px; color:var(--ink-600); font-family:'Poppins',sans-serif; font-weight:600; }

/* ===== EMPTY / LOADING ===== */
.state-box{
  text-align:center; padding:60px 20px; color:var(--ink-600);
}
.state-box .display{ font-size:26px; color:var(--teal-800); margin-bottom:6px; }
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--teal-700);
  margin:0 auto 14px; animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}


/* ===== MOBILE: grid rapat ===== */
@media (max-width:639px){
  main{ padding-top:16px; }
  .grid{ gap:12px; }
  .item-body{ padding:10px 10px 12px; }
  .item-name{ font-size:13.5px; }
}
@media (min-width:640px){
  .grid{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); }
}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <img src="ikon.png" alt="Logo Warmindo Sandaga" onerror="this.style.display='none'"/>
  <div class="topbar-text">
    <div class="eyebrow">DAFTAR MENU</div>
    <div class="brand">Warmindo Sandaga</div>
  </div>
</div>


<div class="catnav-wrap">
  <nav class="catnav" id="catNav"></nav>
</div>

<main id="main">
  <div class="state-box" id="stateBox">
    <div class="spinner"></div>
    <div>Memuat menu...</div>
  </div>
</main>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
/* ============ FIREBASE CONFIG (sama dengan kasir, read-only) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBMIOjbSOJl7QsqRIZ7ywOdplBMNQi1GCU",
  authDomain: "kedaiwarmindo-9f399.firebaseapp.com",
  projectId: "kedaiwarmindo-9f399",
  storageBucket: "kedaiwarmindo-9f399.firebasestorage.app",
  messagingSenderId: "437768743863",
  appId: "1:437768743863:web:1af406325e70f7f5889632",
  measurementId: "G-JRVJMF1PXQ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Aktifkan cache offline: kunjungan berikutnya, menu langsung tampil dari
// data terakhir yang tersimpan di HP pengunjung sambil nunggu update dari server.
// (Kalau dibuka di banyak tab sekaligus, browser cuma bisa aktifin di 1 tab —
// itu wajar, bukan error, tab lain tetap jalan normal cuma tanpa cache).
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  console.warn('Firestore persistence tidak aktif:', err.code);
});

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatRupiah(n){
  n = Number(n)||0;
  return n.toLocaleString('id-ID');
}

const PLACEHOLDER_ICON = `<div class="nophoto-stamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h2.5l1.5-2h5l1.5 2H20v10H4z"/><circle cx="12" cy="13" r="3"/><path d="M3 3l18 18"/></svg><span>Gambar belum<br>di-upload admin</span></div>`;

const LOADING_STAMP = `<div class="loading-stamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9" /></svg><span>Memuat<br>gambar</span></div>`;

let menuItems = [];
let activeCategory = null;
let menuPhotoCache = {};      // {itemId: url}    -> sudah diambil & ada foto
                               // {itemId: null}   -> sudah dicek, memang tidak ada foto
                               // (belum ada key)   -> belum diambil sama sekali
let fetchingPhotoIds = new Set();
let hasRenderedMenu = false;

function centerActiveTab(smooth){
  const nav = document.getElementById('catNav');
  const btn = nav.querySelector('button.active');
  if(!btn) return;
  const left = btn.offsetLeft - (nav.clientWidth - btn.offsetWidth)/2;
  nav.scrollTo({ left: Math.max(0,left), behavior: smooth ? 'smooth' : 'auto' });
}

function currentCategories(){
  return [...new Set(menuItems.map(m=>m.category).filter(Boolean))];
}

/* Tampilkan HANYA satu kategori; kategori lain disembunyikan. */
function showCategory(cat){
  if(cat === activeCategory) return;
  activeCategory = cat;
  const main = document.getElementById('main');
  main.classList.remove('no-anim');   // biar kartu kategori baru muncul dengan animasi
  document.querySelectorAll('#catNav button').forEach(b=>b.classList.toggle('active', b.dataset.cat===cat));
  document.querySelectorAll('.cat-section[data-cat]').forEach(sec=>{
    sec.classList.toggle('is-hidden', sec.dataset.cat !== cat);
  });
  centerActiveTab(true);
  // kalau pengunjung sedang scroll jauh ke bawah, mulai dari awal daftar kategori baru
  const bar = document.getElementById('topbar');
  const barBottom = bar ? bar.getBoundingClientRect().bottom : 0;
  const top = main.getBoundingClientRect().top + window.scrollY - barBottom - 10;
  if(window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
  prioritizeCategory(cat);
  pumpPhotoQueue();
}

function renderCatNav(cats){
  const nav = document.getElementById('catNav');
  nav.style.scrollBehavior = 'auto';
  nav.innerHTML = cats.map(c =>
    `<button data-cat="${escapeHtml(c)}" class="${c===activeCategory?'active':''}">${escapeHtml(c)}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=> showCategory(btn.dataset.cat));
  });
  centerActiveTab(false);
  nav.style.scrollBehavior = '';
}

function slugify(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'lainnya';
}

function photoImgHtml(url, name){
  return `${LOADING_STAMP}<img src="${escapeHtml(url)}" alt="${escapeHtml(name)}" decoding="async" onload="this.classList.add('loaded');this.parentElement.classList.add('loaded')" onerror="this.parentElement.outerHTML='&lt;div class=&quot;item-photo placeholder&quot;&gt;${PLACEHOLDER_ICON.replace(/"/g,'&quot;')}&lt;/div&gt;'"/>`;
}

function itemCard(item, indexInCategory){
  const soldOut = !!item.soldOut;
  let photo;
  if(item.imageUrl){
    // Data lama yang belum sempat dimigrasi ke koleksi menuPhotos — tampilkan langsung.
    photo = `<div class="item-photo">${photoImgHtml(item.imageUrl, item.name)}</div>`;
  } else {
    const cached = menuPhotoCache[item.id];
    if(cached === undefined){
      // Belum diambil: kotak shimmer, nanti diisi begitu fetch fotonya selesai.
      photo = `<div class="item-photo" id="photo-${item.id}">${LOADING_STAMP}</div>`;
    } else if(cached){
      photo = `<div class="item-photo">${photoImgHtml(cached, item.name)}</div>`;
    } else {
      photo = `<div class="item-photo placeholder">${PLACEHOLDER_ICON}</div>`;
    }
  }
  // Delay bertahap tiap kartu biar kesannya muncul satu-satu dari atas
  const delay = Math.min(indexInCategory * 45, 480);
  return `
    <div class="item-card ${soldOut?'sold-out':''}" data-id="${escapeHtml(item.id)}" style="animation-delay:${delay}ms">
      ${soldOut?'<div class="soldout-badge">Habis</div>':''}
      ${item.isNew?'<div class="new-stamp" title="Menu baru"><small>Menu</small><b>Baru</b></div>':''}
      ${photo}
      <div class="item-body">
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-price">${formatRupiah(item.price)}</div>
      </div>
    </div>`;
}

/* ===== URUTAN MENU =====
   1) yang tersedia di atas, yang HABIS di bawah
   2) di tiap kelompok: yang sudah ada gambarnya dulu, baru yang belum
   3) sisanya urut abjad.
   Status foto baru diketahui setelah fetch selesai, jadi sebelum itu dianggap "ada foto";
   begitu semua foto selesai dicek, kartu dirapikan SEKALI (resortGrids). */
function hasPhoto(item){
  if(item.imageUrl) return true;
  return menuPhotoCache[item.id] !== null;   // undefined (belum dicek) dianggap ada
}
function compareItems(a,b){
  return (a.soldOut?1:0) - (b.soldOut?1:0)
      || Number(hasPhoto(b)) - Number(hasPhoto(a))
      || String(a.name||'').localeCompare(String(b.name||''), 'id', {sensitivity:'base'});
}
let resortTimer = null;
function scheduleResort(){
  clearTimeout(resortTimer);
  resortTimer = setTimeout(()=>{
    if(activePhotoFetches > 0 || photoQueue.length || revealQueue.length){ scheduleResort(); return; }
    resortGrids();
  }, 600);
}
function resortGrids(){
  menuItems.sort(compareItems);
  document.querySelectorAll('.cat-section[data-cat]').forEach(sec=>{
    const grid = sec.querySelector('.grid');
    if(!grid) return;
    const cat = sec.dataset.cat;
    menuItems.filter(m=>m.category===cat).forEach(item=>{
      const card = grid.querySelector('.item-card[data-id="'+item.id.replace(/"/g,'')+'"]');
      if(card) grid.appendChild(card);   // appendChild memindahkan kartu sesuai urutan baru
    });
  });
}

/* ===== ANTREAN FOTO: diambil satu-per-satu sesuai URUTAN TAMPILAN (atas -> bawah) =====
   Sebelumnya semua foto di-fetch sekaligus berdasarkan urutan nama, jadi yang muncul
   duluan acak. Sekarang antrean disusun sesuai urutan kategori & kartu di layar, dan
   hanya beberapa fetch berjalan bersamaan (PHOTO_CONCURRENCY) supaya foto paling atas
   selalu dapat giliran & bandwidth lebih dulu. Tiap foto langsung tampil begitu
   selesai, tanpa menunggu foto lain. */
const PHOTO_CONCURRENCY = 3;
let photoQueue = [];
let activePhotoFetches = 0;

/* Foto yang sudah siap tidak langsung ditempel semua, tapi masuk antrean tampil:
   dimunculkan SATU per satu sesuai urutan di layar (atas -> bawah) dengan jeda kecil. */
const REVEAL_GAP_MS = 110;
let revealQueue = [];      // [{order, apply}]
let revealTimer = null;
let photoOrder = {};       // {itemId: urutan tampil di layar}

function enqueueReveal(item, apply){
  revealQueue.push({ order: photoOrder[item.id] ?? 1e9, apply });
  revealQueue.sort((x,y)=>x.order - y.order);
  if(!revealTimer) drainReveal();
}
function drainReveal(){
  const next = revealQueue.shift();
  if(!next){ revealTimer = null; scheduleResort(); return; }
  next.apply();
  revealTimer = setTimeout(drainReveal, REVEAL_GAP_MS);
}

function showPhoto(item, url){
  const slot = document.getElementById('photo-'+item.id);
  if(!slot) return;
  if(url){
    const img = new Image();
    img.alt = item.name;
    img.decoding = 'async';
    img.onload = ()=>{
      // gambar sudah selesai dimuat & di-decode, tinggal antre untuk ditampilkan
      enqueueReveal(item, ()=>{
        const s = document.getElementById('photo-'+item.id); // slot terbaru (bisa sudah re-render)
        if(!s) return;
        s.innerHTML = '';
        s.appendChild(img);
        requestAnimationFrame(()=>{ img.classList.add('loaded'); s.classList.add('loaded'); });
      });
    };
    img.onerror = ()=>{ console.error('[foto] gambar gagal dimuat untuk', item.name, '— cek isi imageUrl'); menuPhotoCache[item.id] = null; showPhoto(item, null); };
    img.src = url;
  } else {
    enqueueReveal(item, ()=>{
      const s = document.getElementById('photo-'+item.id);
      if(!s) return;
      s.classList.add('placeholder');
      s.innerHTML = PLACEHOLDER_ICON;
    });
  }
}

const photoRetries = {};   // {itemId: jumlah percobaan ulang}
const MAX_PHOTO_RETRY = 3;

function pumpPhotoQueue(){
  while(activePhotoFetches < PHOTO_CONCURRENCY && photoQueue.length){
    const item = photoQueue.shift();
    if(menuPhotoCache[item.id] !== undefined || fetchingPhotoIds.has(item.id)) continue;
    fetchingPhotoIds.add(item.id);
    activePhotoFetches++;
    db.collection('menuPhotos').doc(item.id).get().then(doc=>{
      const url = doc.exists ? ((doc.data()||{}).imageUrl || null) : null;
      if(!doc.exists) console.warn('[foto] dokumen menuPhotos/'+item.id+' tidak ada ('+item.name+')');
      else if(!url) console.warn('[foto] menuPhotos/'+item.id+' ada, tapi field "imageUrl" kosong/tidak ditemukan');
      menuPhotoCache[item.id] = url;
      showPhoto(item, url);
    }).catch(err=>{
      console.error('[foto] gagal ambil menuPhotos/'+item.id+':', err.code || '', err.message || err);
      const n = (photoRetries[item.id] = (photoRetries[item.id]||0) + 1);
      if(n <= MAX_PHOTO_RETRY){
        // coba lagi nanti (mis. koneksi sempat putus), slot tetap shimmer
        setTimeout(()=>{ photoQueue.push(item); pumpPhotoQueue(); }, 1500 * n);
      } else {
        showPhoto(item, null);
      }
    }).finally(()=>{
      fetchingPhotoIds.delete(item.id);
      activePhotoFetches--;
      pumpPhotoQueue();
    });
  }
}

// Urutan: kategori aktif dulu, lalu kategori lain (di-preload di belakang supaya saat
// pindah tab fotonya sudah siap).
function orderedItems(){
  const cats = currentCategories();
  const seq = [activeCategory, ...cats.filter(c=>c!==activeCategory)].filter(Boolean);
  const list = [];
  seq.forEach(cat=> menuItems.forEach(item=>{ if(item.category===cat) list.push(item); }));
  return list;
}

function fetchMissingPhotos(){
  const all = orderedItems();
  photoOrder = {};
  all.forEach((item,i)=>{ photoOrder[item.id] = i; });
  photoQueue = all.filter(item=> !item.imageUrl && menuPhotoCache[item.id] === undefined);
  pumpPhotoQueue();
}

// Saat pindah kategori, foto kategori itu didahulukan (fetch & urutan tampil).
function prioritizeCategory(cat){
  const all = orderedItems();
  photoOrder = {};
  all.forEach((item,i)=>{ photoOrder[item.id] = i; });
  photoQueue = all.filter(item=> photoQueue.some(q=>q.id===item.id));
  revealQueue.sort((x,y)=>x.order - y.order);
}

function renderMenu(){
  const main = document.getElementById('main');
  menuItems.sort(compareItems);
  if(!menuItems.length){
    main.innerHTML = `<div class="state-box"><div class="display">Menu belum tersedia</div><div>Silakan cek lagi sebentar lagi.</div></div>`;
    document.getElementById('catNav').innerHTML = '';
    return;
  }

  const cats = [...new Set(menuItems.map(m=>m.category).filter(Boolean))];
  if(!activeCategory || !cats.includes(activeCategory)) activeCategory = cats[0] || null;
  renderCatNav(cats);

  main.innerHTML = cats.map((cat, catIndex)=>{
    const items = menuItems.filter(m=>m.category===cat);
    return `
      <section class="cat-section${cat===activeCategory?'':' is-hidden'}" id="cat-${slugify(cat)}" data-cat="${escapeHtml(cat)}">
        <div class="grid">
          ${items.map((item, i)=>itemCard(item, i)).join('')}
        </div>
      </section>`;
  }).join('');

  main.classList.toggle('no-anim', hasRenderedMenu);
  hasRenderedMenu = true;
  fetchMissingPhotos();
}

/* ============ REALTIME: MENU (read-only, sinkron dengan kasir) =============
   Koleksi 'menu' sengaja hanya berisi nama/kategori/harga/status — TANPA foto —
   jadi listener ini ringan dan langsung tampil begitu kasir menyimpan sesuatu.
   Fotonya sendiri diambil belakangan per-item dari koleksi 'menuPhotos' lewat
   fetchMissingPhotos(), supaya nggak ikut memperlambat data teks. ============ */
db.collection('menu').orderBy('name').onSnapshot(snap=>{
  menuItems = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderMenu();
}, err=>{
  console.error(err);
  document.getElementById('main').innerHTML = `<div class="state-box"><div class="display">Gagal memuat menu</div><div>Cek koneksi internet, lalu muat ulang halaman.</div></div>`;
});
</script>
